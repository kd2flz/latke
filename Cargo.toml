[package]
name = "latke"
version = "0.1.0"
edition = "2024"
authors = ["David Rhoads <davidrhoads@mailstack.com>"]
description = "A cross-platform desktop client for iBroadcast music service"
license = "GPL-3.0-or-later"

[dependencies]
# GTK and UI
gtk = { version = "0.7", package = "gtk4", features = ["v4_6"] }
adw = { version = "0.5", package = "libadwaita" }
glib = "0.18"
gio = "0.18"
gdk = { version = "0.7", package = "gdk4" }
gdk-pixbuf = "0.18"

# Async runtime and networking
tokio = { version = "1.36", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
reqwest = { version = "0.11", features = ["blocking", "json"] }
url = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Audio playback
gstreamer = "0.20"
gstreamer-app = "0.20"
gstreamer-audio = "0.20"

# Credentials management
keyring = "2.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
log = "0.4"
env_logger = "0.10"
async-trait = "0.1"
futures = "0.3"
chrono = "0.4"
hostname = "0.3"